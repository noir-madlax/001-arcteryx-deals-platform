server {
    listen 80;
    listen [::]:80;
    server_name 001.100app.dev;
    server_tokens off;

    access_log /var/log/nginx/geardrop.access.log;
    error_log /var/log/nginx/geardrop.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/geardrop/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    include /etc/nginx/snippets/geardrop-common.conf;
}
