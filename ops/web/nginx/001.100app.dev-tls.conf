server {
    listen 80;
    listen [::]:80;
    server_name 001.100app.dev;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/geardrop/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 001.100app.dev;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/001.100app.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/001.100app.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:GearDropSSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/geardrop.access.log;
    error_log /var/log/nginx/geardrop.error.log warn;

    include /etc/nginx/snippets/geardrop-common.conf;
}
