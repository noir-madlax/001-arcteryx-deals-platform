<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index,follow">
  <title>GearDrop Support</title>
  <meta name="description" content="Contact GearDrop support about the iOS app, purchases, price alerts, privacy, or data requests.">
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f5ef;
      --surface: #fffdf8;
      --ink: #1d221f;
      --muted: #606961;
      --border: #ded8ca;
      --accent: #246b45;
      --danger: #a6321f;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    main {
      width: min(720px, calc(100% - 36px));
      margin: 0 auto;
      padding: 52px 0 72px;
    }
    .kicker {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 54px);
      line-height: 1.05;
    }
    .intro {
      max-width: 620px;
      margin: 16px 0 28px;
      color: var(--muted);
      font-size: 17px;
    }
    form {
      display: grid;
      gap: 18px;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
    }
    label {
      display: grid;
      gap: 7px;
      font-size: 14px;
      font-weight: 750;
    }
    input,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      padding: 12px;
    }
    input:focus,
    textarea:focus {
      border-color: var(--accent);
      outline: 3px solid rgba(36, 107, 69, 0.12);
    }
    textarea { min-height: 170px; resize: vertical; }
    button {
      min-height: 48px;
      border: 0;
      border-radius: 7px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
    }
    button:disabled { cursor: wait; opacity: 0.65; }
    .status {
      min-height: 24px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }
    .status.success { color: var(--accent); }
    .status.error { color: var(--danger); }
    .fine-print {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    a { color: var(--accent); font-weight: 700; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .website-field {
      position: absolute;
      left: -10000px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">GearDrop</p>
    <h1>Support</h1>
    <p class="intro">
      Send us a message about the iOS app, purchases, price alerts, privacy, or a data request.
      We will use the email below only to reply and handle your request.
    </p>

    <form id="support-form">
      <label>
        Email
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
      </label>
      <label>
        Subject
        <input id="subject" name="subject" type="text" autocomplete="off" minlength="3" maxlength="120" required>
      </label>
      <label>
        Message
        <textarea id="message" name="message" minlength="10" maxlength="4000" required></textarea>
      </label>
      <label class="website-field" aria-hidden="true">
        Website
        <input id="website" name="website" type="text" autocomplete="off" tabindex="-1">
      </label>
      <button id="submit" type="submit">Send request</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>

    <p class="fine-print">
      See the <a href="/privacy.html">Privacy Policy</a> for how GearDrop handles support and alert data.
      <a href="/">Return to the website</a>.
    </p>
  </main>

  <script>
    'use strict';

    const SUPABASE_URL = 'https://bupqagkrcvrezjkdbald.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1cHFhZ2tyY3ZyZXpqa2RiYWxkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NDU1NTMsImV4cCI6MjA5MjAyMTU1M30.oszdUJIEKMCvpD9XFzTYTCYXj078uwjzFx84tfStfRU';
    const form = document.getElementById('support-form');
    const submit = document.getElementById('submit');
    const status = document.getElementById('status');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;

      status.className = 'status';
      status.textContent = 'Sending…';
      submit.disabled = true;

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/submit_support_request`, {
          method: 'POST',
          headers: {
            apikey: SUPABASE_ANON,
            Authorization: `Bearer ${SUPABASE_ANON}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            p_email: document.getElementById('email').value.trim().toLowerCase(),
            p_subject: document.getElementById('subject').value.trim(),
            p_message: document.getElementById('message').value.trim(),
            p_locale: navigator.language || 'en',
            p_website: document.getElementById('website').value,
          }),
        });

        if (!response.ok) {
          throw new Error(response.status === 429 ? 'Too many requests. Please try again later.' : 'The request could not be sent. Please try again.');
        }

        const requestId = String(await response.json());
        if (!/^[0-9a-f-]{36}$/i.test(requestId)) throw new Error('The support service returned an invalid response.');
        form.reset();
        status.className = 'status success';
        status.textContent = `Request received. Reference: ${requestId.slice(0, 8).toUpperCase()}`;
      } catch (error) {
        status.className = 'status error';
        status.textContent = error instanceof Error ? error.message : 'The request could not be sent. Please try again.';
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
